<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Reiknigáta</title>
  <meta name="theme-color" content="#1b2a4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leikir">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <div class="bar-left">
        <a class="home" href="../" aria-label="Heim">‹</a>
        <div class="stat" aria-label="Tími"><span aria-hidden="true">⏱️</span> <span id="time">0:00</span></div>
      </div>
      <button id="new" class="new" type="button" aria-label="Ný gáta">🔄</button>
      <div class="stat" aria-label="Útfylltir reitir"><span aria-hidden="true">✏️</span> <span id="solved">0/3</span></div>
    </header>

    <div class="row">
      <nav class="levels" id="levels">
        <button type="button" data-level="easy">Létt</button>
        <button type="button" data-level="medium">Miðlungs</button>
        <button type="button" data-level="hard">Erfitt</button>
      </nav>
      <button id="trophy" class="trophy" type="button" aria-label="Metin mín"><span aria-hidden="true">🏆</span> <span id="best">–</span></button>
    </div>

    <div class="signs" id="signs" role="group" aria-label="Veldu merki">
      <span class="signs-label">Merki:</span>
      <button type="button" data-op="+" aria-label="Plús">+</button>
      <button type="button" data-op="−" aria-label="Mínus">−</button>
      <button type="button" data-op="×" aria-label="Sinnum">×</button>
      <button type="button" data-op="÷" aria-label="Deilt með">÷</button>
    </div>

    <div class="board-wrap" id="wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="pad" id="pad">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="back" class="erase" aria-label="Stroka út">⌫</button>
      <button type="button" data-key="next" class="next" aria-label="Næsti reitur">▶</button>
    </div>
    <p class="hint">Ýttu á auðan reit og sláðu inn tölu</p>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="card">
      <div class="big" id="result-emoji">🎉</div>
      <h2 id="result-title">Þú kláraðir!</h2>
      <p id="result-text"></p>
      <div id="result-board"></div>
      <button id="again" class="again" type="button">Ný gáta</button>
    </div>
  </div>

  <div class="overlay" id="confirm" hidden>
    <div class="card">
      <div class="big">🤔</div>
      <h2>Ný gáta?</h2>
      <p>Gátan sem þú ert með hverfur.</p>
      <div class="actions">
        <button id="confirm-yes" class="again" type="button">Já</button>
        <button class="again secondary" type="button" data-close>Nei</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="records" hidden>
    <div class="card records">
      <h2>🏆 Metin mín</h2>
      <table>
        <thead><tr><th>Stig</th><th>Met</th><th>Klárað</th></tr></thead>
        <tbody id="records-body"></tbody>
      </table>
      <h3>Síðustu gátur</h3>
      <ol id="history" class="history"></ol>
      <button class="again" type="button" data-close>Loka</button>
    </div>
  </div>

  <script src="../common.js"></script>
  <script src="../leaderboard-config.js"></script>
  <script src="../leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
