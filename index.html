<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Leikir</title>
  <meta name="theme-color" content="#4a752c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leikir">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="common.css">
  <style>
    .start { justify-content: center; gap: 18px; }
    .start h1 { margin: 0 0 6px; text-align: center; font-size: 40px; }
    .game {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-radius: 24px;
      background: #fff;
      color: #333;
      text-decoration: none;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
    }
    .game:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25); }
    .game img { width: 96px; height: 96px; border-radius: 20px; flex: none; }
    .game h2 { margin: 0 0 4px; font-size: 28px; }
    .game p { margin: 0; font-size: 16px; color: #666; }
    .game .go { margin-left: auto; font-size: 34px; color: #bbb; }
  </style>
</head>
<body>
  <main class="app start">
    <h1>Leikir</h1>
    <a class="game" href="namuleit/">
      <img src="icons/namuleit.png" alt="">
      <div>
        <h2>Námuleit</h2>
        <p id="ms-note">Finndu allar sprengjurnar</p>
      </div>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a class="game" href="sudoku/">
      <img src="icons/sudoku.png" alt="">
      <div>
        <h2>Sudoku</h2>
        <p id="sd-note">Tölurnar 1 til 9</p>
      </div>
      <span class="go" aria-hidden="true">›</span>
    </a>
  </main>

  <script src="common.js"></script>
  <script>
    // Show each game's record, or that a sudoku is waiting to be finished.
    const ms = makeRecords(makeStore('ms-'));
    const msBest = Object.keys(LEVEL_NAMES).find((lv) => ms.best(lv));
    if (msBest) $('ms-note').textContent = `🏆 ${LEVEL_NAMES[msBest]}: ${ms.best(msBest)} sek`;

    const sdStore = makeStore('sd-');
    const sd = makeRecords(sdStore);
    const current = sdStore.getJSON('current', null);
    const sdBest = Object.keys(LEVEL_NAMES).find((lv) => sd.best(lv));
    if (current && LEVEL_NAMES[current.level]) $('sd-note').textContent = `▶ Halda áfram (${LEVEL_NAMES[current.level]})`;
    else if (sdBest) $('sd-note').textContent = `🏆 ${LEVEL_NAMES[sdBest]}: ${clock(sd.best(sdBest))}`;

    registerServiceWorker('sw.js');
  </script>
</body>
</html>
