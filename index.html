<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Leikir</title>
  <meta name="theme-color" content="#1b2a4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leikir">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="common.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; height: auto; }
    .home-page {
      flex: 1;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding:
        calc(env(safe-area-inset-top) + 28px)
        calc(env(safe-area-inset-right) + 18px)
        calc(env(safe-area-inset-bottom) + 24px)
        calc(env(safe-area-inset-left) + 18px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .masthead h1 {
      margin: 0;
      font-family: var(--display);
      font-size: var(--s5);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .player {
      padding: 7px 14px;
      border: none;
      border-radius: 999px;
      background: #fff;
      font-size: var(--s-1);
      font-weight: 600;
      box-shadow: inset 0 0 0 2px var(--wool);
      max-width: 50%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player[hidden] { display: none; }

    /* A game: a solid tile in the game's own colour */
    .tile {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 112px;
      padding: 16px 18px 16px 16px;
      border-radius: 28px;
      color: #fff;
      text-decoration: none;
      background: var(--c);
      box-shadow: 0 6px 0 var(--c-dark);
    }
    .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c-dark); }
    .tile.ms { --c: var(--moss); --c-dark: var(--moss-dark); }
    .tile.sd { --c: var(--glacier); --c-dark: var(--glacier-dark); }
    .tile.rg { --c: var(--crowberry); --c-dark: var(--crowberry-dark); }
    .tile img {
      flex: none;
      width: 80px;
      height: 80px;
      border-radius: 21px;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9);
    }
    .tile-text { display: grid; gap: 4px; min-width: 0; }
    .tile-name { font-family: var(--display); font-size: 29px; font-weight: 800; line-height: 1; }
    .tile-note { font-size: 15px; line-height: 1.3; opacity: 0.92; }

    .leaderboard {
      margin-top: auto;   /* sits at the bottom of the screen */
      padding: 16px;
      border-radius: 999px;
      background: var(--puffin);
      color: var(--night);
      font-size: var(--s1);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      box-shadow: var(--edge) var(--puffin-dark);
    }
    .leaderboard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--puffin-dark); }
    .leaderboard[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="home-page">
    <div class="masthead">
      <h1>Leikir</h1>
      <button class="player" id="player" type="button" hidden></button>
    </div>

    <a class="tile ms" href="namuleit/">
      <img src="icons/namuleit.png" alt="">
      <span class="tile-text">
        <span class="tile-name">Minesweeper</span>
        <span class="tile-note" id="ms-note">Finndu allar sprengjurnar</span>
      </span>
    </a>
    <a class="tile sd" href="sudoku/">
      <img src="icons/sudoku.png" alt="">
      <span class="tile-text">
        <span class="tile-name">Sudoku</span>
        <span class="tile-note" id="sd-note">Tölurnar 1 til 9</span>
      </span>
    </a>
    <a class="tile rg" href="reiknigata/">
      <img src="icons/reiknigata.png" alt="">
      <span class="tile-text">
        <span class="tile-name">Reiknigáta</span>
        <span class="tile-note" id="rg-note">Krossgáta með tölum</span>
      </span>
    </a>

    <a class="leaderboard" id="leaderboard" href="stigatafla/" hidden>🏅 Stigatafla</a>
  </main>

  <div class="overlay" id="name" hidden>
    <div class="card" id="name-card"></div>
  </div>

  <script src="common.js"></script>
  <script src="leaderboard-config.js"></script>
  <script src="leaderboard.js"></script>
  <script>

    // Show each game's record, or that a puzzle is waiting to be finished.
    const ms = makeRecords(makeStore('ms-'));
    const msBest = Object.keys(LEVEL_NAMES).find((lv) => ms.best(lv));
    if (msBest) $('ms-note').textContent = `🏆 ${LEVEL_NAMES[msBest]}: ${ms.best(msBest)} sek`;

    for (const prefix of ['sd', 'rg']) {
      const st = makeStore(prefix + '-');
      const rec = makeRecords(st);
      const current = st.getJSON('current', null);
      const best = Object.keys(LEVEL_NAMES).find((lv) => rec.best(lv));
      if (current && LEVEL_NAMES[current.level]) $(prefix + '-note').textContent = `▶ Halda áfram (${LEVEL_NAMES[current.level]})`;
      else if (best) $(prefix + '-note').textContent = `🏆 ${LEVEL_NAMES[best]}: ${clock(rec.best(best))}`;
    }

    // Leaderboard: the button, and who's playing on this phone.
    $('leaderboard').hidden = !lbOn();
    const showPlayer = () => {
      $('player').hidden = !lbOn();
      $('player').textContent = playerName() ? `👤 ${playerName()}` : '👤 Hvað heitir þú?';
    };
    $('player').addEventListener('click', () => {
      $('name-card').replaceChildren(nameForm(() => { $('name').hidden = true; showPlayer(); }, 'Hvað heitir þú?'));
      $('name').hidden = false;
      $('name-card').querySelector('input').focus();
    });
    showPlayer();

    registerServiceWorker('sw.js');
  </script>
</body>
</html>
