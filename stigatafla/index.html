<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Stigatafla</title>
  <meta name="theme-color" content="#1b2a4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leikir">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <style>
    .title { margin: 0; font-family: var(--display); font-size: var(--s2); font-weight: 800; line-height: 1; letter-spacing: -0.02em; text-align: center; }
    .app > .levels { flex: none; }   /* shared style lets them grow, which is meant for a row */
    .levels button[hidden] { display: none; }
    .games { border-radius: 24px; }
    .games button { position: relative; display: grid; place-items: center; padding: 6px 0; border-radius: 20px; }
    .games img { width: 42px; height: 42px; border-radius: 11px; opacity: 0.5; transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
    /* the small Sudoku shares the big one's icon, with its size on it */
    .games .badge {
      position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
      padding: 1px 4px; border-radius: 6px; background: #fff; color: var(--glacier-dark);
      font-size: 10px; font-weight: 800; line-height: 1.2; white-space: nowrap;
    }
    .games button.active { background: var(--game); box-shadow: 0 3px 0 var(--game-dark); }
    .games button.active img { opacity: 1; transform: scale(1.06); box-shadow: 0 0 0 2px #fff; }
    .refresh {
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: #fff; font-size: 20px; box-shadow: var(--edge) var(--wool);
    }
    .refresh:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wool); }
    .me {
      align-self: center;
      padding: 7px 16px;
      border: none;
      border-radius: 999px;
      background: #fff;
      font-size: var(--s-1);
      font-weight: 600;
      box-shadow: inset 0 0 0 2px var(--wool);
    }
    .list-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      border-radius: 24px;
      background: #fff;
      box-shadow: inset 0 0 0 2px var(--wool);
    }
    .list { margin: 0; padding: 6px 0; list-style: none; }
    .list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-top: 2px solid var(--snow);
      font-size: var(--s0);
    }
    .list li:first-child { border-top: none; }
    .list .place { width: 36px; text-align: center; font-weight: 700; font-size: var(--s1); color: var(--night-soft); }
    .list .who { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list .time { font-weight: 700; font-variant-numeric: tabular-nums; }
    /* the top three get the display face, the winner biggest */
    .list li:nth-child(-n + 3) .who { font-family: var(--display); font-weight: 800; font-size: var(--s1); }
    .list li:first-child .who { font-size: var(--s2); }
    .list li.mine { background: #fff1e2; box-shadow: inset 4px 0 0 var(--puffin); }
    .status { padding: 32px 22px; text-align: center; color: var(--night-soft); font-size: var(--s0); line-height: 1.45; }
  </style>
</head>
<body>
  <main class="app">
    <header class="bar">
      <div class="bar-left"><a class="home" href="../" aria-label="Heim">‹</a></div>
      <h1 class="title">Stigatafla</h1>
      <button id="refresh" class="refresh" type="button" aria-label="Uppfæra">🔄</button>
    </header>

    <button id="me" class="me" type="button"></button>

    <nav class="levels games" id="games">
      <button type="button" data-game="minesweeper" aria-label="Minesweeper"><img src="../icons/namuleit.png" alt=""></button>
      <button type="button" data-game="sudoku" aria-label="Sudoku"><img src="../icons/sudoku.png" alt=""></button>
      <button type="button" data-game="sudoku6" aria-label="Sudoku 6×6"><img src="../icons/sudoku.png" alt=""><span class="badge" aria-hidden="true">6×6</span></button>
      <button type="button" data-game="reiknigata" aria-label="Reiknigáta"><img src="../icons/reiknigata.png" alt=""></button>
      <button type="button" data-game="crowd" aria-label="Crowd Runner"><img src="../icons/crowd.png" alt=""></button>
      <button type="button" data-game="tetris" aria-label="Tetris"><img src="../icons/tetris.png" alt=""></button>
    </nav>
    <nav class="levels" id="levels">
      <button type="button" data-level="easy">Létt</button>
      <button type="button" data-level="medium">Miðlungs</button>
      <button type="button" data-level="hard">Erfitt</button>
    </nav>

    <div class="list-wrap">
      <ol class="list" id="list"></ol>
      <div class="status" id="status" hidden></div>
    </div>
  </main>

  <div class="overlay" id="name" hidden>
    <div class="card" id="name-card"></div>
  </div>

  <script src="../common.js"></script>
  <script src="../leaderboard-config.js"></script>
  <script src="../leaderboard.js"></script>
  <script>
    const view = makeStore('lb-');
    let game = view.get('view-game', 'minesweeper');
    let level = view.get('view-level', 'easy');
    if (!GAME_NAMES[game]) game = 'minesweeper';
    if (!LEVEL_NAMES[level]) level = 'easy';
    let loadId = 0;

    function status(text) {
      $('list').replaceChildren();
      $('status').textContent = text;
      $('status').hidden = false;
    }

    // The page takes on the colour of the game being shown.
    const GAME_COLORS = {
      minesweeper: ['--moss', '--moss-dark'],
      sudoku: ['--glacier', '--glacier-dark'],
      reiknigata: ['--crowberry', '--crowberry-dark'],
      crowd: ['--lagoon', '--lagoon-dark'],
      sudoku6: ['--glacier', '--glacier-dark'],
      tetris: ['--heather', '--heather-dark'],
    };

    async function load() {
      const [c, dark] = GAME_COLORS[game];
      document.documentElement.style.setProperty('--game', `var(${c})`);
      document.documentElement.style.setProperty('--game-dark', `var(${dark})`);
      document.querySelectorAll('#games button').forEach((b) => b.classList.toggle('active', b.dataset.game === game));
      // Crowd Runner has only medium and hard
      const shown = byStars(game) && level === 'easy' ? 'medium' : level;
      document.querySelectorAll('#levels button').forEach((b) => {
        b.classList.toggle('active', b.dataset.level === shown);
        b.hidden = byStars(game) && b.dataset.level === 'easy';
      });
      $('me').textContent = playerName() ? `👤 ${playerName()} ✏️` : '👤 Skrifaðu nafnið þitt';
      if (!lbOn()) return status('Stigataflan hefur ekki verið sett upp enn.');

      const id = ++loadId;
      status('Sæki…');
      await lbFlush();
      let board;
      try {
        board = await lbBoard(game, shown);
      } catch {
        if (id === loadId) status('Næ ekki í stigatöfluna. Tengdu netið og ýttu svo á 🔄.');
        return;
      }
      if (id !== loadId) return;   // a newer tab was picked meanwhile
      if (!board.length) return status('Enginn er kominn á töfluna hér. Kláraðu leik og vertu fyrst/ur!');

      $('status').hidden = true;
      const me = playerName().toLowerCase();
      const medals = ['🥇', '🥈', '🥉'];
      $('list').replaceChildren(...board.map((row, i) => {
        const li = document.createElement('li');
        if (row.player.trim().toLowerCase() === me) li.className = 'mine';
        const place = document.createElement('span');
        place.className = 'place';
        place.textContent = medals[i] || i + 1;
        const who = document.createElement('span');
        who.className = 'who';
        who.textContent = row.player;
        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = byStars(game) ? `⭐ ${row.stars}` : game === 'tetris' ? `${row.points} stig` : clock(row.seconds);
        li.append(place, who, time);
        return li;
      }));
    }

    $('games').addEventListener('click', (e) => {
      const b = e.target.closest('[data-game]');
      if (!b) return;
      game = b.dataset.game;
      view.set('view-game', game);
      load();
    });
    $('levels').addEventListener('click', (e) => {
      const b = e.target.closest('[data-level]');
      if (!b) return;
      level = b.dataset.level;
      view.set('view-level', level);
      load();
    });
    $('refresh').addEventListener('click', load);
    $('me').addEventListener('click', () => {
      $('name-card').replaceChildren(nameForm(() => { $('name').hidden = true; load(); }, 'Hvað heitir þú?'));
      $('name').hidden = false;
      $('name-card').querySelector('input').focus();
    });

    load();
    registerServiceWorker('../sw.js');
  </script>
</body>
</html>
