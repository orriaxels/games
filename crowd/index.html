<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Crowd Runner</title>
  <meta name="theme-color" content="#1b2a4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leikir">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <div class="bar-left">
        <a class="home" href="../" aria-label="Heim">‹</a>
        <div class="stat" aria-label="Í hópnum"><span aria-hidden="true">👥</span> <span id="count">1</span></div>
      </div>
      <button id="new" class="new" type="button" aria-label="Byrja borðið aftur">🔄</button>
      <div class="stat" aria-label="Í kastalanum"><span aria-hidden="true">🏰</span> <span id="boss">0</span></div>
    </header>

    <div class="row">
      <button id="level-btn" class="level-btn" type="button" aria-label="Velja borð">Borð <span id="level-no">1</span> <span id="level-mode" hidden>🔥 Erfitt</span> <span class="level-stars" id="level-stars"></span></button>
      <button id="pause" class="sound" type="button" aria-label="Hlé" disabled>⏸️</button>
      <button id="sound" class="sound" type="button" aria-label="Hljóð">🔊</button>
    </div>

    <div class="board-wrap" id="wrap">
      <canvas id="game" aria-label="Hópurinn hleypur eftir veginum"></canvas>
    </div>
    <p class="hint" id="hint">Dragðu hópinn til hliðar til að velja hlið</p>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="card">
      <div class="big" id="result-emoji">🎉</div>
      <h2 id="result-title">Þú vannst!</h2>
      <div class="stars" id="stars" aria-hidden="true"></div>
      <p id="result-text"></p>
      <div id="result-board"></div>
      <div class="actions">
        <button id="again" class="again secondary" type="button">Aftur</button>
        <button id="next" class="again" type="button">Næsta borð</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="picker" hidden>
    <div class="card picker">
      <h2>Veldu borð</h2>
      <div class="modes" id="modes">
        <button type="button" data-mode="medium">Miðlungs</button>
        <button type="button" data-mode="hard">🔥 Erfitt</button>
      </div>
      <p id="picker-total"></p>
      <p class="outfit-label">Hver hleypur?</p>
      <div class="creatures" id="creatures"></div>
      <p class="outfit-label" id="outfit-label">Litur á fötunum</p>
      <div class="outfits" id="outfits"></div>
      <div class="level-grid" id="level-grid"></div>
      <button class="again secondary" type="button" data-close>Loka</button>
    </div>
  </div>

  <script src="../common.js"></script>
  <script src="../leaderboard-config.js"></script>
  <script src="../leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
