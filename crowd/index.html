<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Crowd Runner</title>
  <meta name="theme-color" content="#1b2a4a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Leikir">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <div class="bar-left">
        <a class="home" href="../" aria-label="Heim">‹</a>
        <div class="stat" aria-label="Í hópnum"><span aria-hidden="true">👥</span> <span id="count">1</span></div>
      </div>
      <button id="new" class="new" type="button" aria-label="Byrja aftur">🔄</button>
      <div class="stat" aria-label="Í kastalanum"><span aria-hidden="true">🏰</span> <span id="boss">0</span></div>
    </header>

    <div class="row">
      <nav class="levels" id="levels">
        <button type="button" data-level="easy">Létt</button>
        <button type="button" data-level="medium">Miðlungs</button>
        <button type="button" data-level="hard">Erfitt</button>
      </nav>
      <button id="trophy" class="trophy" type="button" aria-label="Metin mín"><span aria-hidden="true">🏆</span> <span id="best">–</span></button>
    </div>

    <div class="board-wrap" id="wrap">
      <canvas id="game" aria-label="Hópurinn hleypur eftir veginum"></canvas>
    </div>
    <p class="hint">Dragðu hópinn til hliðar til að velja hlið</p>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="card">
      <div class="big" id="result-emoji">🎉</div>
      <h2 id="result-title">Þú vannst!</h2>
      <p id="result-text"></p>
      <div id="result-board"></div>
      <button id="again" class="again" type="button">Spila aftur</button>
    </div>
  </div>

  <div class="overlay" id="records" hidden>
    <div class="card records">
      <h2>🏆 Metin mín</h2>
      <table>
        <thead><tr><th>Stig</th><th>Met</th><th>Unnið</th></tr></thead>
        <tbody id="records-body"></tbody>
      </table>
      <h3>Síðustu leikir</h3>
      <ol id="history" class="history"></ol>
      <button class="again" type="button" data-close>Loka</button>
    </div>
  </div>

  <script src="../common.js"></script>
  <script src="../leaderboard-config.js"></script>
  <script src="../leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
